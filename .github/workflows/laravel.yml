name: Laravel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  laravel-tests-phpunit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_sqlite, mbstring, zip, bcmath
          ini-values: memory_limit=256M
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Directory permissions
        run: |
          mkdir -p storage bootstrap/cache
          chmod -R 777 storage bootstrap/cache

      - name: Prepare Laravel application
        run: |
          cp .env.ci .env
          php artisan key:generate --ansi

      - name: Debug database config
        run: |
          echo "DB_CONNECTION=$(grep DB_CONNECTION .env)"
          echo "DB_DATABASE=$(grep DB_DATABASE .env)"
          ls -la /tmp/testing.sqlite 2>&1 || true
          php -r "echo 'pdo_sqlite: '; echo extension_loaded('pdo_sqlite') ? 'yes' : 'no'; echo PHP_EOL;"

      - name: Run migrations
        run: php artisan migrate --force --verbose

      - name: Execute PHPUnit tests
        run: |
          set +e
          vendor/bin/phpunit --verbose 2>&1 | tee /tmp/phpunit.log
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "PHPUnit failed with exit code $EXIT_CODE"
            tail -30 /tmp/phpunit.log | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $EXIT_CODE
